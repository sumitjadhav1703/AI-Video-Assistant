name: Purge old jobs

# Deletes eligible terminal jobs and their pgvector collections after 24 hours via the
# backend's token-gated /admin/cleanup endpoint. Runs on a schedule so orphaned
# data never piles up in Neon, and can also be triggered by hand.
on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call /admin/cleanup (older_than_days=1)
        env:
          # Set these in the repo: Settings -> Secrets and variables -> Actions.
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ] || [ -z "$BACKEND_URL" ]; then
            echo "Set both BACKEND_URL and ADMIN_TOKEN in repository Actions secrets." >&2
            exit 1
          fi
          # --retry handles Render free-tier cold starts (the service may be asleep).
          curl -fsS -X POST \
            --retry 5 --retry-all-errors --retry-delay 30 --max-time 180 \
            "$BACKEND_URL/admin/cleanup?older_than_days=1" \
            -H "X-Admin-Token: $ADMIN_TOKEN"
